<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - CBNU DxH Research Group</title>
    <meta name="description" content="Photos, events, and lab moments of CBNU DxH Research Group.">
    <link rel="stylesheet" href="../styles.css?v=20260826v10">
    <!-- Google Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <style>
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 28px;
            padding: 24px 0 70px;
        }
        @media (max-width: 992px) {
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }
        }
        @media (max-width: 640px) {
            .gallery-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }
        .gallery-item {
            border-radius: 14px;
            overflow: hidden;
            background: #0F172A;
            border: 1px solid var(--border-color);
            position: relative;
            cursor: pointer;
            aspect-ratio: 1 / 1;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease, border-color 0.3s ease;
        }
        .gallery-item:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 32px rgba(15, 23, 42, 0.16);
            border-color: var(--primary-color);
        }
        .gallery-img-wrapper {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #F1F5F9;
        }
        .gallery-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
            display: block;
        }
        .gallery-item:hover .gallery-img-wrapper img {
            transform: scale(1.06);
        }
        /* Top-Right Translucent Date Badge (Compact) */
        .gallery-item-date-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 3;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            color: #FFFFFF;
            font-family: var(--font-mono);
            font-size: 0.74rem;
            font-weight: 600;
            padding: 3px 9px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            pointer-events: none;
            letter-spacing: 0.02em;
        }
        /* Bottom Hover Overlay Title */
        .gallery-item-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 2;
            padding: 44px 18px 18px;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0) 0%, rgba(15, 23, 42, 0.82) 45%, rgba(15, 23, 42, 0.96) 100%);
            color: #FFFFFF;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }
        .gallery-item:hover .gallery-item-overlay {
            opacity: 1;
            transform: translateY(0);
        }
        @media (hover: none) {
            .gallery-item-overlay {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .gallery-item-caption {
            font-family: var(--font-headline);
            font-size: 1.05rem;
            font-weight: 750;
            color: #FFFFFF;
            line-height: 1.45;
            margin: 0;
            word-break: keep-all;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
        }
        .gallery-empty-state-box {
            grid-column: 1 / -1;
            padding: 80px 20px;
            text-align: center;
            background: #F8FAFC;
            border: 2px dashed #CBD5E1;
            border-radius: 16px;
            color: #64748B;
            margin: 20px 0 60px;
        }
        .gallery-empty-state-box span {
            font-size: 56px;
            color: #94A3B8;
            display: block;
            margin-bottom: 12px;
        }
        .gallery-empty-state-box h3 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }
        .gallery-empty-state-box p {
            font-size: 0.95rem;
            color: #64748B;
            margin: 0;
        }
        /* Modal Lightbox */
        .lightbox-modal {
            display: none;
            position: fixed;
            z-index: 9999;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .lightbox-modal.active {
            display: flex;
        }
        .lightbox-content {
            max-width: 1000px;
            max-height: 92vh;
            background: #FFFFFF;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .lightbox-content img {
            max-width: 100%;
            max-height: 78vh;
            object-fit: contain;
            background: #0B1120;
            display: block;
        }
        .lightbox-caption {
            padding: 18px 24px;
            background: #FFFFFF;
        }
        .lightbox-caption h4 {
            margin: 0 0 6px;
            font-family: var(--font-headline);
            font-size: 1.15rem;
            font-weight: 800;
            color: #0F172A;
            word-break: keep-all;
        }
        .lightbox-caption p {
            margin: 0;
            font-size: 0.92rem;
            color: #64748B;
            font-family: var(--font-mono);
        }
        .lightbox-close {
            position: absolute;
            top: 14px; right: 14px;
            background: rgba(15, 23, 42, 0.75);
            color: #FFFFFF;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            width: 38px; height: 38px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            transition: all 0.2s ease;
            z-index: 10;
        }
        .lightbox-close:hover {
            background: var(--primary-color);
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div id="header-placeholder"></div>

    <main class="page-content">
        <div class="page-header">
            <div class="container">
                <h1 class="page-title">Gallery</h1>
                <p class="page-breadcrumb">
                    <a href="../index.html">Home</a> &gt; <span>Gallery</span>
                </p>
            </div>
        </div>

        <div class="container">
            <div class="gallery-grid" id="gallery-grid-container">
                <div class="gallery-empty-state-box">
                    <span class="material-symbols-outlined">photo_library</span>
                    <h3>No Photos Yet</h3>
                    <p>New research group photos and activity moments will be updated here soon.</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Lightbox Modal -->
    <div class="lightbox-modal" id="lightboxModal" onclick="closeLightbox(event)">
        <div class="lightbox-content" onclick="event.stopPropagation()">
            <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
            <img id="lightboxImg" src="" alt="Full preview">
            <div class="lightbox-caption">
                <h4 id="lightboxTitle"></h4>
                <p id="lightboxDesc"></p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <script src="../components.js?v=20260826v10"></script>
    <script src="../script.js?v=20260826v10"></script>
    <script src="../js/data-loader.js?v=20260826v10"></script>
    <script>
        function resolveImgPath(raw) {
            if (!raw) return '';
            return '../' + raw.replace(/^(\.\.\/|\.\/)/, '');
        }

        function renderGallery() {
            const container = document.getElementById('gallery-grid-container');
            if (!container) return;
            if (typeof galleryData !== 'undefined' && galleryData.length > 0 && galleryData.some(g => g.thumbnail || g.image)) {
                const valid = galleryData.filter(g => g.thumbnail || g.image);
                container.innerHTML = valid.map((g, idx) => {
                    const imgSrc = resolveImgPath(g.thumbnail || g.image);
                    return `
                    <div class="gallery-item" onclick="openLightbox(${idx})">
                        ${g.date ? `<div class="gallery-item-date-badge">${g.date}</div>` : ''}
                        <div class="gallery-img-wrapper">
                            <img src="${imgSrc}" alt="${g.title || 'Gallery photo'}" loading="lazy">
                        </div>
                        <div class="gallery-item-overlay">
                            <h3 class="gallery-item-caption">${g.title || 'Lab Photo'}</h3>
                        </div>
                    </div>
                `}).join('');
            } else {
                container.innerHTML = `
                    <div class="gallery-empty-state-box">
                        <span class="material-symbols-outlined">photo_library</span>
                        <h3>No Photos Yet</h3>
                        <p>New research group photos and activity moments will be updated here soon.</p>
                    </div>
                `;
            }
        }

        function openLightbox(index) {
            const valid = (typeof galleryData !== 'undefined' ? galleryData : []).filter(g => g.thumbnail || g.image);
            const item = valid[index];
            if (!item) return;

            const fullImgSrc = resolveImgPath(item.image || item.thumbnail);
            document.getElementById('lightboxImg').src = fullImgSrc;
            document.getElementById('lightboxTitle').textContent = item.title || 'Lab Photo';
            document.getElementById('lightboxDesc').textContent = item.description || item.date || '';
            document.getElementById('lightboxModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            const modal = document.getElementById('lightboxModal');
            if (modal) modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeLightbox();
        });

        window.addEventListener('dataLoaded', renderGallery);
        if (typeof galleryData !== 'undefined' && galleryData.length > 0) {
            renderGallery();
        }
    </script>
</body>
</html>
